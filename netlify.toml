[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify serves from the site root, not /student-tracker/.
  BASE_PATH = "/"

# Single-page app: unknown paths fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
